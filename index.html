<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#101827" />
  <meta name="google-site-verification" content="bluoGsdPqmUAjveZrVN3P-qpGgMa15jmtfJsyEhtNwA" />
  <title>SALASAR TRADERS</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1220;
      --panel: #131e30;
      --line: rgba(255,255,255,.11);
      --text: #f4f7fb;
      --muted: #9eacc0;
      --accent: #d8b56d;
      --accent-soft: rgba(216,181,109,.13);
      --success: #a8dfbd;
    }
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      padding: max(24px, env(safe-area-inset-top)) 16px max(24px, env(safe-area-inset-bottom));
      background: radial-gradient(ellipse at 50% -15%, rgba(216,181,109,.16), transparent 48%), var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }
    .app { width: 100%; max-width: 440px; margin: 0 auto; }
    .brand {
      display: flex; align-items: center; justify-content: center; gap: 11px;
      margin: 10px 2px 48px;
    }
    .brand-mark {
      width: 43px; height: 43px; border: 1px solid rgba(216,181,109,.55);
      border-radius: 13px; display: grid; place-items: center; color: var(--accent);
      background: var(--accent-soft); font-weight: 800; font-size: 17px;
    }
    .brand-name { font-size: 15px; font-weight: 800; letter-spacing: 1.8px; }
    .field-label {
      display: flex; align-items: center; justify-content: space-between;
      margin: 0 2px 9px; color: #dce4ef; font-size: 12px;
      font-weight: 750; letter-spacing: .8px;
    }
    .live-tag { color: var(--success); font-size: 10px; letter-spacing: 1px; }
    .input-wrap {
      display: flex; align-items: center; gap: 8px; background: var(--panel);
      border: 1px solid rgba(216,181,109,.4); border-radius: 17px;
      padding: 5px 8px 5px 16px; box-shadow: 0 12px 32px rgba(0,0,0,.16);
    }
    input {
      flex: 1; min-width: 0; width: 100%; min-height: 64px; border: 0; outline: 0;
      background: transparent; color: var(--text);
      font: 600 27px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 1.4px; caret-color: var(--accent);
    }
    input::placeholder { color: #64748a; font-size: 17px; letter-spacing: 0; font-weight: 450; }
    .clear-btn {
      flex: 0 0 auto; min-width: 66px; min-height: 42px; border: 1px solid var(--line);
      border-radius: 11px; background: #263348; color: #e8edf5;
      font: 650 12px system-ui, sans-serif; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
    }
    .clear-btn:active { transform: scale(.97); background: #34445c; }
    .direction {
      display: flex; align-items: center; justify-content: center; gap: 9px;
      height: 62px; color: var(--muted); font-size: 10px; font-weight: 750; letter-spacing: 1.25px;
    }
    .direction .arrow { color: var(--accent); font-size: 19px; }
    .output-card {
      min-height: 130px; padding: 17px 16px; border: 1px solid var(--line);
      border-radius: 17px; background: linear-gradient(145deg, #18263a, #0d1727);
    }
    .output-title { color: #dce4ef; font-size: 12px; font-weight: 750; letter-spacing: .8px; }
    .mode {
      float: right; margin-top: -2px; padding: 5px 8px; color: var(--accent);
      background: var(--accent-soft); border-radius: 7px; font-size: 9px;
      font-weight: 800; letter-spacing: .7px;
    }
    .result {
      min-height: 58px; display: flex; align-items: center; overflow-wrap: anywhere;
      padding-top: 10px; color: var(--success);
      font: 700 30px/1.35 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      letter-spacing: 1.4px; user-select: text;
    }
    .result.empty { color: #607087; font: 450 14px/1.4 system-ui, sans-serif; letter-spacing: 0; }
    .notice { min-height: 18px; margin: 10px 3px 0; color: #e7b978; font-size: 11px; line-height: 1.5; }
    @media (max-width: 360px) {
      body { padding-left: 12px; padding-right: 12px; }
      input { font-size: 23px; }
      .result { font-size: 26px; }
      .brand { margin-bottom: 40px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <header class="brand">
      <div class="brand-mark">S</div>
      <div class="brand-name">SALASAR TRADERS</div>
    </header>

    <label class="field-label" for="sourceInput">
      <span>INPUT</span>
      <span class="live-tag">● LIVE</span>
    </label>
    <div class="input-wrap">
      <input id="sourceInput" type="text" inputmode="text" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="Type here..." autofocus />
      <button class="clear-btn" id="clearBtn" type="button" aria-label="Clear input">CLEAR</button>
    </div>

    <div class="direction" aria-hidden="true">
      <span id="fromLabel">NUMBER</span>
      <span class="arrow">→</span>
      <span id="toLabel">ALPHABET</span>
    </div>

    <section class="output-card" aria-live="polite">
      <span class="mode" id="modeLabel">NUMBER → LETTER</span>
      <div class="output-title">OUTPUT</div>
      <div class="result empty" id="result">Result</div>
    </section>
    <p class="notice" id="notice" aria-live="polite"></p>
  </main>

  <script>
    (() => {
      'use strict';
      const numberToLetter = ['Z', 'A', 'B', 'C', 'D', 'E', 'F', 'G', 'H', 'I'];
      const letterToNumber = { A: '1', B: '2', C: '3', D: '4', E: '5', F: '6', G: '7', H: '8', I: '9', Z: '0' };
      const input = document.getElementById('sourceInput');
      const result = document.getElementById('result');
      const notice = document.getElementById('notice');
      const modeLabel = document.getElementById('modeLabel');
      const fromLabel = document.getElementById('fromLabel');
      const toLabel = document.getElementById('toLabel');
      const clearBtn = document.getElementById('clearBtn');

      function convert(value) {
        let output = '', hasDigits = false, hasLetters = false;
        const unsupported = new Set();
        for (const char of value) {
          if (char >= '0' && char <= '9') {
            hasDigits = true;
            output += numberToLetter[Number(char)];
          } else if (/^[a-z]$/i.test(char)) {
            hasLetters = true;
            const upper = char.toUpperCase();
            if (Object.prototype.hasOwnProperty.call(letterToNumber, upper)) output += letterToNumber[upper];
            else { output += char; unsupported.add(upper); }
          } else output += char;
        }
        let mode = 'NUMBER → LETTER', from = 'NUMBER', to = 'ALPHABET';
        if (hasDigits && hasLetters) { mode = 'MIXED INPUT'; from = 'MIXED'; to = 'CONVERTED'; }
        else if (hasLetters) { mode = 'LETTER → NUMBER'; from = 'ALPHABET'; to = 'NUMBER'; }
        return { output, mode, from, to, unsupported: [...unsupported] };
      }

      function update() {
        const value = input.value;
        if (!value) {
          result.textContent = 'Result';
          result.classList.add('empty');
          modeLabel.textContent = 'NUMBER → LETTER';
          fromLabel.textContent = 'NUMBER';
          toLabel.textContent = 'ALPHABET';
          notice.textContent = '';
          return;
        }
        const converted = convert(value);
        result.textContent = converted.output;
        result.classList.remove('empty');
        modeLabel.textContent = converted.mode;
        fromLabel.textContent = converted.from;
        toLabel.textContent = converted.to;
        notice.textContent = converted.unsupported.length
          ? converted.unsupported.join(', ') + ' कोड में शामिल नहीं हैं।'
          : '';
      }

      input.addEventListener('input', update);
      clearBtn.addEventListener('click', () => {
        input.value = '';
        update();
        input.focus();
      });
      update();
    })();
  </script>
</body>
</html>
